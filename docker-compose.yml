services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
      POSTGRES_DB: flowboard
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowboard -d flowboard"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - flowboard-data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://flowboard:flowboard@db:5432/flowboard
      JWT_SECRET: local-flowboard-access-secret-change-this
      REFRESH_TOKEN_SECRET: local-flowboard-refresh-secret-change-this
      WEB_ORIGIN: http://localhost:3001
      DEMO_PASSWORD: flowboard-demo-password
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        API_ORIGIN: http://api:4000
    ports:
      - "3001:3000"
    depends_on:
      - api
volumes:
  flowboard-data:
