name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowboard
          POSTGRES_PASSWORD: flowboard
          POSTGRES_DB: flowboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowboard -d flowboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://flowboard:flowboard@localhost:5432/flowboard_test
      JWT_SECRET: ci-access-secret-that-is-only-for-tests
      REFRESH_TOKEN_SECRET: ci-refresh-secret-that-is-only-for-tests
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: scripts/in-dev npm ci
      - run: scripts/in-dev npm run db:migrate --workspace @flowboard/api
      - run: scripts/in-dev npm run check
